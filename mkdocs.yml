site_name: SomaFractalMemory
site_description: Enterprise AI Memory System
site_author: SomaTechLat
repo_url: https://github.com/somatechlat/somafractalmemory
repo_name: somatechlat/somafractalmemory

# Every page listed here must exist: `mkdocs build --strict` runs in
# .github/workflows/docs.yml and treats a dangling nav entry as a failure.
# The tree below is the real docs/ tree — the previous nav pointed at
# technical-manual/ and development-manual/, neither of which exists.
nav:
  - Home: README.md
  - Guides:
    - User Guide: USER_GUIDE.md
    - Operations Manual: OPS_MANUAL.md
    - Production Readiness: PRODUCTION_READINESS.md
    - Architecture: architecture.md
    - Deployment: deployment.md
    - API Reference: api-reference.md
    - Style Guide: style-guide.md
    - SRS: SRS-SOMAFRACTALMEMORY-MASTER.md
  - Quality Management System:
    - Document Register: iso/DOCUMENT-REGISTER.md
    - Document Control & Traceability: iso/SOMA-SFM-DOCS-001.md
    - Quality Manual: iso/SOMA-SFM-QMS-001.md
    - Architecture: iso/SOMA-SFM-ARCH-001.md
    - Software Development Plan: iso/SOMA-SFM-SDP-001.md
    - Requirements: iso/SOMA-SFM-SRS-001.md
    - Security: iso/SOMA-SFM-SEC-001.md
    - Verification & Validation: iso/SOMA-SFM-VV-001.md
    - Risk Register: iso/SOMA-SFM-RISK-001.md
    - Audit: iso/SOMA-SFM-AUDIT-001.md
    - Compatibility: iso/SOMA-SFM-COMPAT-001.md
    - Production: iso/SOMA-SFM-PROD-001.md
  - Project Records:
    - Execution Plan: project/SOMA-SFM-EXEC-001.md
    - Architecture Redesign: project/SOMA-ARCH-REDESIGN-001.md
    - Feature Matrix: project/SOMA-FEAT-MATRIX-001.md
    - Module Architecture: project/SOMA-MOD-ARCH-001.md
    - Module Specification: project/SOMA-MOD-SPEC-001.md
    - UI Specification: project/SOMA-UI-SPEC-001.md
    - UI/UX: project/SOMA-UI-UX-001.md
    - UI Mockups: project/SOMA-UI-MOCKUPS-001.md

theme:
  name: material
  palette:
    primary: indigo
    accent: deep purple
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - toc.integrate
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - git-revision-date-localized:
      type: date
  - minify:
      minify_html: true
  # The `social` plugin is intentionally absent. It generates Open Graph share
  # cards and warns under --strict because `site_url` is unset. This repository
  # publishes no site — there is no pages workflow and no gh-pages branch — so
  # the cards would link nowhere. The `extra.social` footer links below are
  # theme links and are unaffected.

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - meta
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      use_pygments: true
      linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/somatechlat/somafractalmemory
    - icon: fontawesome/brands/docker
      link: https://hub.docker.com/r/somatechlat/somafractalmemory
