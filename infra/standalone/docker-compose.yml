# SomaFractalMemory — Standalone Cluster
# Identifiable in Docker Desktop as "somafractalmemory-standalone"
name: somafractalmemory-standalone

services:
  # --- Redis cache -------------------------------------------
  somafractalmemory-standalone-redis:
    image: redis:7.2-alpine
    container_name: somafractalmemory-standalone-redis
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - somafractalmemory-standalone-net
    ports:
      - "10379:6379"

  # --- Vault secrets -----------------------------------------
  somafractalmemory-standalone-vault:
    image: hashicorp/vault:1.13.3
    container_name: somafractalmemory-standalone-vault
    restart: unless-stopped
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "${SOMA_VAULT_TOKEN:?set SOMA_VAULT_TOKEN}"
      VAULT_ADDR: "http://0.0.0.0:8200"
    ports:
      - "10200:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: [ "CMD", "vault", "status" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - somafractalmemory-standalone-net

  # --- Vault init helper -------------------------------------
  somafractalmemory-standalone-vault-init:
    image: alpine:latest
    container_name: somafractalmemory-standalone-vault-init
    depends_on:
      somafractalmemory-standalone-vault:
        condition: service_healthy
    environment:
      # Bootstrap topology only. Credentials are FILE paths into t=0 material —
      # never values in ENV (Rule 164).
      SOMA_VAULT_TOKEN_FILE: "${SOMA_VAULT_TOKEN_FILE:?set SOMA_VAULT_TOKEN_FILE}"
      SOMA_VAULT_ADDR: "${SOMA_VAULT_ADDR:?set SOMA_VAULT_ADDR}"
      SOMA_DB_USER: "${SOMA_DB_USER:?set SOMA_DB_USER}"
      SOMA_DB_NAME: "${SOMA_DB_NAME:?set SOMA_DB_NAME}"
      SOMA_DB_HOST: "${SOMA_DB_HOST:?set SOMA_DB_HOST}"
      SOMA_DB_PORT: "${SOMA_DB_PORT:?set SOMA_DB_PORT}"
      SOMA_REDIS_HOST: "${SOMA_REDIS_HOST:?set SOMA_REDIS_HOST}"
      SOMA_REDIS_PORT: "${SOMA_REDIS_PORT:?set SOMA_REDIS_PORT}"
      SOMA_DB_PASSWORD_FILE: "${SOMA_DB_PASSWORD_FILE:?set SOMA_DB_PASSWORD_FILE}"
      SOMA_REDIS_PASSWORD_FILE: "${SOMA_REDIS_PASSWORD_FILE:?set SOMA_REDIS_PASSWORD_FILE}"
      SOMA_API_TOKEN_FILE: "${SOMA_API_TOKEN_FILE:?set SOMA_API_TOKEN_FILE}"
    volumes:
      - ${SOMA_T0_SECRETS_DIR:?set SOMA_T0_SECRETS_DIR}:/run/secrets_t0:ro
    networks:
      - somafractalmemory-standalone-net
    entrypoint: [ "sh", "-c" ]
    command:
      - |
        apk add --no-cache curl jq

        # Credentials come from t=0 files. A missing file is a refusal — this
        # job will NOT invent a substitute (Rule 91 / Rule 164).
        read_secret() {
          f="$${1:?read_secret needs a path}"
          if [ ! -s "$${f}" ]; then
            echo "FATAL: secret file missing or empty: $${f}" >&2
            exit 1
          fi
          tr -d '\r\n' < "$${f}"
        }
        VAULT_TOKEN="$$(read_secret "$${SOMA_VAULT_TOKEN_FILE}")"
        SOMA_DB_PASSWORD="$$(read_secret "$${SOMA_DB_PASSWORD_FILE}")"
        SOMA_REDIS_PASSWORD="$$(read_secret "$${SOMA_REDIS_PASSWORD_FILE}")"
        SOMA_API_TOKEN="$$(read_secret "$${SOMA_API_TOKEN_FILE}")"

        # Wait for vault
        until curl -s "$${SOMA_VAULT_ADDR}/v1/sys/health"; do sleep 1; done
        # Mount KV v2
        curl -H "X-Vault-Token: $${VAULT_TOKEN}" -X POST -d '{"type":"kv-v2"}' "$${SOMA_VAULT_ADDR}/v1/sys/mounts/somafractalmemory"

        # Write Database Credentials
        curl -H "X-Vault-Token: $${VAULT_TOKEN}" -X POST \
          -d "{\"data\": {\"username\": \"$${SOMA_DB_USER}\", \"password\": \"$${SOMA_DB_PASSWORD}\", \"host\": \"$${SOMA_DB_HOST}\", \"port\": $${SOMA_DB_PORT}, \"dbname\": \"$${SOMA_DB_NAME}\"}}" \
          "$${SOMA_VAULT_ADDR}/v1/somafractalmemory/data/database"

        # Write Redis Credentials
        curl -H "X-Vault-Token: $${VAULT_TOKEN}" -X POST \
          -d "{\"data\": {\"host\": \"$${SOMA_REDIS_HOST}\", \"port\": $${SOMA_REDIS_PORT}, \"password\": \"$${SOMA_REDIS_PASSWORD}\"}}" \
          "$${SOMA_VAULT_ADDR}/v1/somafractalmemory/data/redis"

        # Write API token (the process authenticates with this bearer).
        curl -H "X-Vault-Token: $${VAULT_TOKEN}" -X POST \
          -d "{\"data\": {\"soma_api_token\": \"$${SOMA_API_TOKEN}\"}}" \
          "$${SOMA_VAULT_ADDR}/v1/somafractalmemory/data/credentials"

        echo "Vault initialized and secrets populated."

  # --- Database ----------------------------------------------
  somafractalmemory-standalone-postgres:
    image: postgres:15-alpine
    container_name: somafractalmemory-standalone-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${SOMA_DB_NAME:?set SOMA_DB_NAME}"
      POSTGRES_USER: "${SOMA_DB_USER:?set SOMA_DB_USER}"
      POSTGRES_PASSWORD: "${SOMA_DB_PASSWORD:?set SOMA_DB_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "10432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U somafractalmemory" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - somafractalmemory-standalone-net

  # --- OPA ---------------------------------------------------
  somafractalmemory-standalone-opa:
    image: openpolicyagent/opa:0.54.0
    container_name: somafractalmemory-standalone-opa
    restart: unless-stopped
    ports:
      - "10818:8181"
    command:
      - "run"
      - "--server"
      - "--log-level=info"
    healthcheck:
      test: [ "CMD", "/opa", "eval", "time.now_ns()" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - somafractalmemory-standalone-net

  # --- Etcd --------------------------------------------------
  somafractalmemory-standalone-etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: somafractalmemory-standalone-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_RETENTION: "1"
      ETCD_LISTEN_CLIENT_URLS: "http://0.0.0.0:2379"
      ETCD_ADVERTISE_CLIENT_URLS: "http://somafractalmemory-standalone-etcd:2379"
    healthcheck:
      test: [ "CMD", "etcdctl", "endpoint", "health" ]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - somafractalmemory-standalone-net

  # --- MinIO -------------------------------------------------
  somafractalmemory-standalone-minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: somafractalmemory-standalone-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: "${SOMA_MINIO_ROOT_USER:?set SOMA_MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${SOMA_MINIO_ROOT_PASSWORD:?set SOMA_MINIO_ROOT_PASSWORD}"
    command: server /data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      somafractalmemory-standalone-net:
        aliases:
          - minio

  # --- Milvus vector store -----------------------------------
  somafractalmemory-standalone-milvus:
    image: milvusdb/milvus:v2.3.3
    container_name: somafractalmemory-standalone-milvus
    restart: unless-stopped
    depends_on:
      somafractalmemory-standalone-etcd:
        condition: service_healthy
      somafractalmemory-standalone-minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 4G
    environment:
      ETCD_ENDPOINTS: "somafractalmemory-standalone-etcd:2379"
      MINIO_ADDRESS: "minio:9000"
      MINIO_ACCESS_KEY: "${SOMA_MINIO_ROOT_USER:?set SOMA_MINIO_ROOT_USER}"
      MINIO_SECRET_KEY: "${SOMA_MINIO_ROOT_PASSWORD:?set SOMA_MINIO_ROOT_PASSWORD}"
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "10530:19530"
      - "10531:9091"
    command: [ "milvus", "run", "standalone" ]
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9091/healthz" ]
      interval: 30s
      timeout: 20s
      retries: 10
      start_period: 180s
    networks:
      - somafractalmemory-standalone-net

  somafractalmemory-standalone-api:
    build:
      context: ../..
      dockerfile: infra/standalone/Dockerfile
    image: somafractalmemory:latest
    container_name: somafractalmemory-standalone-api
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
    depends_on:
      somafractalmemory-standalone-vault-init:
        condition: service_completed_successfully
      somafractalmemory-standalone-redis:
        condition: service_healthy
      somafractalmemory-standalone-postgres:
        condition: service_healthy
      somafractalmemory-standalone-opa:
        condition: service_healthy
      somafractalmemory-standalone-milvus:
        condition: service_healthy
    networks:
      - somafractalmemory-standalone-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${SOMA_T0_SECRETS_DIR:?set SOMA_T0_SECRETS_DIR}:/run/secrets_t0:ro
    environment:
      DJANGO_SETTINGS_MODULE: "somafractalmemory.settings.standalone"
      # Shared seam dim: agent MEM_EMBED_DIM == brain EMBED_DIM == this.
      # Required — no schema default at the call site or in compose.
      SOMA_VECTOR_DIM: "${SOMA_VECTOR_DIM:?set SOMA_VECTOR_DIM}"
      MEM_EMBED_DIM: "${MEM_EMBED_DIM:?set MEM_EMBED_DIM}"
      # VAULT BOOTSTRAP ONLY — address + token FILE, never the token value.
      VAULT_ADDR: "${SOMA_VAULT_ADDR:?set SOMA_VAULT_ADDR}"
      VAULT_TOKEN_FILE: "${SOMA_VAULT_TOKEN_FILE:?set SOMA_VAULT_TOKEN_FILE}"
      SOMA_LOG_LEVEL: "${SOMA_LOG_LEVEL:?set SOMA_LOG_LEVEL}"
      SOMA_ALLOWED_HOSTS: "${SOMA_ALLOWED_HOSTS:?set SOMA_ALLOWED_HOSTS}"
      # API token is Vault material (somafractalmemory runtime secrets).
      # There is deliberately no SOMA_API_TOKEN here.
      SOMA_API_PORT: "${SOMA_API_PORT:?set SOMA_API_PORT}"
      # INFRA HOST NAMES ONLY (Credentials via Vault, with env fallback)
      SOMA_DB_HOST: "somafractalmemory-standalone-postgres"
      SOMA_DB_USER: "${SOMA_DB_USER:?set SOMA_DB_USER}"
      SOMA_DB_PASSWORD: "${SOMA_DB_PASSWORD}"
      SOMA_DB_NAME: "${SOMA_DB_NAME:?set SOMA_DB_NAME}"
      SOMA_REDIS_HOST: "somafractalmemory-standalone-redis"
      SOMA_MILVUS_HOST: "somafractalmemory-standalone-milvus"
      SOMA_OPA_URL: "http://somafractalmemory-standalone-opa:8181"
    ports:
      - "10101:10101"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:10101/healthz || exit 1" ]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    cap_drop: [ "ALL" ]
    read_only: false
    security_opt:
      - no-new-privileges:true

# Shared-network option:
#   docker compose -f docker-compose.yml -f docker-compose.shared-network.yml up -d
#   (attaches all services to the external `soma-stack-net` bridge)
networks:
  somafractalmemory-standalone-net:
    driver: bridge

volumes:
  postgres_data:
  milvus_data:
  redis_data:
