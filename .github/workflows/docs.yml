name: Documentation Checks

# Document-control enforcement for everything under docs/.
# Implements SOMA-SFM-DOCS-001 §5.2, rules C-01..C-12.
#
# This workflow previously called `scripts/audit-docs.py` twice and uploaded
# `docs/doc-health-report.json`. Neither file has ever existed in this
# repository, so the job could not have passed. It also rendered PlantUML for
# `docs/**/*.puml`, of which there are none, and auto-committed the result back
# to the branch. Those steps are gone. What runs now is the checker that
# actually exists, against the register that is actually generated.

"on":
  pull_request:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'scripts/check_docs.py'
      - 'scripts/gen_register.py'
      - '.github/workflows/docs.yml'
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'scripts/check_docs.py'
      - 'scripts/gen_register.py'
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sundays

jobs:
  document-control:
    name: ISO document control
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # C-01..C-12: required control fields, Revision History shape, filename
      # and identifier agreement, and C-10 register <-> QMS matrix agreement.
      - name: Document-control compliance
        run: python3 scripts/check_docs.py

      # The register is derived data. If regenerating it produces a diff, a
      # document was added or edited without running `make docs-register`.
      - name: Register is generated, not hand-edited
        run: |
          python3 scripts/gen_register.py
          if ! git diff --exit-code docs/iso/DOCUMENT-REGISTER.md; then
            echo "::error file=docs/iso/DOCUMENT-REGISTER.md::Document Register is stale. Run 'make docs-register' and commit the result."
            exit 1
          fi

      # --strict turns a dangling nav entry or a broken in-page link into a
      # failure, so a page can never be renamed or deleted without this
      # catching the reference. The nav lists real files only.
      - name: Site builds against the real document tree
        run: |
          pip install --quiet mkdocs-material mkdocs-git-revision-date-localized-plugin mkdocs-minify-plugin
          mkdocs build --strict
